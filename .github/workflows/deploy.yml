name: Deploy ESP Platform to GitHub Pages

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build production dist (with pre-built docs fallback)
        run: |
          if (npm install --legacy-peer-deps && npm run build && cp dist/index.html dist/404.html && touch dist/.nojekyll); then
            echo "Fresh Vite build succeeded!"
          else
            echo "Fresh Vite build failed; deploying verified pre-built docs/ bundle instead..."
            rm -rf dist
            cp -r docs dist
            cp dist/index.html dist/404.html
            touch dist/.nojekyll
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./dist"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
